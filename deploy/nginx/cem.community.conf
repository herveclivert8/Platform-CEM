# ========================================
# Reverse proxy HTTPS du VPS (nginx installé sur l'hôte, hors Docker)
#
#   cem.community      -> conteneur frontend (127.0.0.1:8090, HTTP_PORT), qui relaie /api et /uploads au backend
#   www.cem.community  -> redirection 301 vers cem.community
#
# VPS partagé avec d'autres sites : ce fichier ne déclare aucun default_server et
# tous ses noms globaux (zones limit_req, map, cache SSL) sont préfixés "cem_".
# Le port 8090 doit correspondre à HTTP_PORT dans .env.production.
#
# Installation (dans cet ordre : ce fichier référence le certificat, il doit exister avant) :
#
#   1. DNS : cem.community et www.cem.community -> IP du VPS (A / AAAA)
#   2. Certificat (les sites existants restent actifs) :
#        sudo certbot certonly --nginx -d cem.community -d www.cem.community \
#             --deploy-hook "systemctl reload nginx"
#   3. Activer ce site (sans toucher aux autres) :
#        sudo cp deploy/nginx/cem.community.conf /etc/nginx/sites-available/
#        sudo ln -s /etc/nginx/sites-available/cem.community.conf /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
#   4. Vérifier le renouvellement : sudo certbot renew --dry-run
# ========================================

# Limitation de débit par IP (en plus du rate limit du backend).
# Valeurs larges : beaucoup d'utilisateurs peuvent partager une IP (NAT opérateur mobile).
limit_req_zone $binary_remote_addr zone=cem_api:10m  rate=30r/s;
limit_req_zone $binary_remote_addr zone=cem_auth:10m rate=30r/m;

map $http_upgrade $cem_connection_upgrade {
    default upgrade;
    ''      close;
}

# --- HTTP -> HTTPS (+ challenge ACME pour le renouvellement certbot) ---
server {
    listen 80;
    listen [::]:80;
    server_name cem.community www.cem.community;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://cem.community$request_uri;
    }
}

# --- www -> apex : une seule origine, donc un seul jeu de cookies __Host- ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.cem.community;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/cem.community/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cem.community/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:cem_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    return 301 https://cem.community$request_uri;
}

# --- Site ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cem.community;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/cem.community/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cem.community/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:cem_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (2 ans) : ne soumettre à hstspreload.org qu'en connaissance de cause
    # (includeSubDomains + preload engagent tous les sous-domaines, quasi irréversible)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    # Le backend pose aussi HSTS : on ne garde que celui-ci
    proxy_hide_header Strict-Transport-Security;

    client_max_body_size 21m;  # PDF jusqu'à 20 Mo (/api/v1/upload/document)
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 60s;

    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Remplace (et non complète) X-Forwarded-For : le client ne peut pas injecter d'IP
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $cem_connection_upgrade;
    proxy_read_timeout 60s;

    # Authentification : login, refresh, register... (le backend verrouille aussi par compte)
    location ^~ /api/v1/auth/ {
        limit_req zone=cem_auth burst=30 nodelay;
        proxy_pass http://127.0.0.1:8090;
    }

    location /api/ {
        limit_req zone=cem_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8090;
    }

    location / {
        proxy_pass http://127.0.0.1:8090;
    }
}
