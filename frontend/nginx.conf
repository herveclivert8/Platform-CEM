# Sert le build React et relaie l'API vers le conteneur backend.
# En production, placez un reverse proxy HTTPS (Caddy, Traefik, nginx + certbot...) devant ce conteneur.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Taille max des images envoyées (MAX_UPLOAD_SIZE = 5 Mo côté API)
    client_max_body_size 6m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        # IP réelle du visiteur (rate limit, journal d'audit). $remote_addr : jamais la valeur envoyée par le client
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /health {
        proxy_pass http://backend:8000/health;
    }

    # Fichiers du build (noms avec empreinte) : cache long
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Application monopage : toute autre URL renvoie index.html (jamais mis en cache)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
