# Même rôle que le proxy de vite.config.ts en développement : le site et l'API partagent la même origine.
# "backend" est le nom du service dans docker-compose.prod.yml.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Images envoyées par les admins (le backend accepte jusqu'à 5 Mo)
    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://backend:8000;
    }

    # Fichiers générés par Vite : leur nom contient un hash, ils peuvent être mis en cache longtemps
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Application monopage : toute autre URL (/antennes, /admin/...) renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
